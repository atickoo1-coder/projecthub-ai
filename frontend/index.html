<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%25230ea5e9'%3E%3Cpath d='M12 2L2 22h20L12 2zm0 4l6.5 13H5.5L12 6z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectHub AI - Academic Portfolio Tracker</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.bottom = '0';
        errDiv.style.left = '0';
        errDiv.style.right = '0';
        errDiv.style.backgroundColor = '#f87171';
        errDiv.style.color = '#fff';
        errDiv.style.padding = '15px';
        errDiv.style.fontSize = '12px';
        errDiv.style.zIndex = '99999';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<strong>Unhandled Error:</strong> ' + event.message + ' at ' + event.filename + ':' + event.lineno;
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.bottom = '0';
        errDiv.style.left = '0';
        errDiv.style.right = '0';
        errDiv.style.backgroundColor = '#fb923c';
        errDiv.style.color = '#fff';
        errDiv.style.padding = '15px';
        errDiv.style.fontSize = '12px';
        errDiv.style.zIndex = '99999';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<strong>Unhandled Promise Rejection:</strong> ' + event.reason;
        document.body.appendChild(errDiv);
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
