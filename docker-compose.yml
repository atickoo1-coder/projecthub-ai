version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: projecthub_db
    restart: always
    environment:
      MYSQL_DATABASE: projecthub
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - projecthub_net

  backend:
    build: ./backend
    container_name: projecthub_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db/projecthub
      - SECRET_KEY=your-super-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - GEMINI_API_KEY=
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - projecthub_net

  frontend:
    build: ./frontend
    container_name: projecthub_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - projecthub_net

volumes:
  mysql_data:

networks:
  projecthub_net:
    driver: bridge
